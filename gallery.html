<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Plate 2.0 | Gallery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/css/lightgallery-bundle.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Oswald:wght@400;700&display=swap');
        :root {
            --bg-suede-green: #0B2E21; 
            --slogan-red: #ff0000; 
            --highlight-cream: #E6D2B5; 
            --marble-black: #1a1a1a; --marble-grey: #2c2c2c;
            --text-white: #f5f5f5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-suede-green); color: var(--text-white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(11, 46, 33, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-logo { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; color:white; text-decoration:none; }
        .nav-logo span { color: var(--slogan-red); }
        .back-link { color: var(--highlight-cream); text-decoration: none; border: 1px solid var(--highlight-cream); padding: 8px 20px; border-radius: 20px; transition: 0.3s; }

        .header-title { text-align: center; padding: 60px 20px; font-family: 'Oswald', sans-serif; font-size: 3rem; text-transform: uppercase; }
        .header-title span { border-bottom: 4px solid var(--slogan-red); }

        .gallery-container { padding: 20px 5%; column-count: 5; column-gap: 15px; }
        .gallery-item {
            display: inline-block; width: 100%; margin-bottom: 15px;
            border-radius: 8px; overflow: hidden; border: 1px solid #333;
            transition: transform 0.3s ease; text-decoration: none;
        }
        .gallery-item:hover { transform: scale(1.02); border-color: var(--slogan-red); }
        .gallery-item img { width: 100%; height: auto; display: block; }

        .lg-backdrop { background-color: rgba(0,0,0,0.95) !important; }

        @media (max-width: 1200px) { .gallery-container { column-count: 3; } }
        @media (max-width: 768px) { .gallery-container { column-count: 2; } .header-title { font-size: 2rem; padding: 40px 20px; } }
    </style>
</head>
<body>
    <nav>
